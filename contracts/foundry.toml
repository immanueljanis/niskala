[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
cbor_metadata = true
bytecode_hash = "none"
use_literal_content = true
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read-write", path = "./deployments" }]

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"

[lint]
lint_on_build = false

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Niskala brand</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400&family=Geist:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --pine: #163F2F; --bg: #f5f7f6; --ink: #0f1613; --muted: #5b6762; }
  body { margin: 0; background: #ffffff; font-family: "Geist", system-ui, sans-serif; color: var(--ink); }
  .stage { display: flex; flex-direction: column; gap: 48px; padding: 48px; }
  #mark { width: 1024px; height: 1024px; border-radius: 224px; background: var(--pine); display: grid; place-items: center; }
  #mark svg { width: 640px; height: 640px; }
  #banner { width: 1600px; height: 900px; background: var(--bg); display: grid; grid-template-columns: 1fr; place-items: center; position: relative; overflow: hidden; }
  #banner .lines { position: absolute; inset: 0; opacity: 0.55; }
  #banner .inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: 36px; }
  #banner .lockup { display: flex; align-items: center; gap: 40px; }
  #banner .lockup .m { width: 168px; height: 168px; border-radius: 40px; background: var(--pine); display: grid; place-items: center; }
  #banner .lockup .m svg { width: 104px; height: 104px; }
  #banner .word { font-family: "Source Serif 4", Georgia, serif; font-size: 168px; letter-spacing: -0.03em; line-height: 1; color: var(--ink); }
  #banner .tag { font-family: "Source Serif 4", Georgia, serif; font-size: 52px; letter-spacing: -0.015em; color: var(--ink); }
  #banner .sub { font-size: 26px; color: var(--muted); }
  #wordmark { width: 1600px; height: 400px; background: #ffffff; display: flex; align-items: center; justify-content: center; gap: 44px; }
  #wordmark .m { width: 200px; height: 200px; border-radius: 48px; background: var(--pine); display: grid; place-items: center; }
  #wordmark .m svg { width: 124px; height: 124px; }
  #wordmark .word { font-family: "Source Serif 4", Georgia, serif; font-size: 220px; letter-spacing: -0.03em; line-height: 1; color: var(--ink); }
</style>
</head>
<body>
<div class="stage">
  <div id="mark">
    <svg viewBox="0 0 32 32" aria-label="Niskala mark"><path d="M9 23V9l14 14V9" fill="none" stroke="#F5F7F6" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"/></svg>
  </div>

  <div id="banner">
    <svg class="lines" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true">
      <g fill="none" stroke="#7a8a84" stroke-width="1.2" stroke-opacity="0.45">
        <path d="M-50 640 C 200 600, 400 700, 650 650 S 1100 560, 1350 630 S 1600 690, 1700 640"/>
        <path d="M-50 680 C 200 640, 400 740, 650 690 S 1100 600, 1350 670 S 1600 730, 1700 680"/>
        <path d="M-50 720 C 200 680, 400 780, 650 730 S 1100 640, 1350 710 S 1600 770, 1700 720"/>
        <path d="M-50 760 C 200 720, 400 820, 650 770 S 1100 680, 1350 750 S 1600 810, 1700 760"/>
        <path d="M-50 800 C 200 760, 400 860, 650 810 S 1100 720, 1350 790 S 1600 850, 1700 800"/>
        <path d="M-50 840 C 200 800, 400 900, 650 850 S 1100 760, 1350 830 S 1600 890, 1700 840"/>
        <path d="M-50 880 C 200 840, 400 940, 650 890 S 1100 800, 1350 870 S 1600 930, 1700 880"/>
      </g>
      <g fill="none" stroke="#163F2F" stroke-width="1.6" stroke-opacity="0.5">
        <path d="M-50 600 C 200 560, 400 660, 650 610 S 1100 520, 1350 590 S 1600 650, 1700 600"/>
      </g>
    </svg>
    <div class="inner">
      <div class="lockup">
        <div class="m"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 23V9l14 14V9" fill="none" stroke="#F5F7F6" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"/></svg></div>
        <div class="word">Niskala</div>
      </div>
      <div class="tag">Private quotes. Provably best execution.</div>
      <div class="sub">Sealed RFQ market on Monad · ZK-verified best execution</div>
    </div>
  </div>

  <div id="wordmark">
    <div class="m"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 23V9l14 14V9" fill="none" stroke="#F5F7F6" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"/></svg></div>
    <div class="word">Niskala</div>
  </div>
</div>
</body>
</html>
